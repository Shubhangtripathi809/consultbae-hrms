<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Submissions — ConsultBae</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
        nav { display: flex; gap: 16px; margin-bottom: 20px; }
        nav a { color: #4f46e5; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        th { background: #4f46e5; color: #fff; padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f9fafb; }
        audio { height: 28px; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-clean { background: #ecfdf5; color: #059669; }
        .badge-moderate { background: #fef3c7; color: #92400e; }
        .badge-noisy { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Submit Audio</a>
            <a href="/submissions">View Submissions</a>
        </nav>
        <h1>All Submissions</h1>
        <p class="subtitle">Audio recordings with extracted metadata.</p>

        <table id="submissionsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Play</th>
                    <th>Duration</th>
                    <th>Sample Rate</th>
                    <th>Bitrate</th>
                    <th>Loudness</th>
                    <th>Noise</th>
                    <th>Submitted</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        async function load() {
            const resp = await fetch('/api/submissions');
            const data = await resp.json();
            const tbody = document.getElementById('tbody');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty">No submissions yet.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((s, i) => {
                let noiseBadge = 'badge';
                if (s.noise_quality && s.noise_quality.includes('Low')) noiseBadge += ' badge-clean';
                else if (s.noise_quality && s.noise_quality.includes('Moderate')) noiseBadge += ' badge-moderate';
                else noiseBadge += ' badge-noisy';

                return `<tr>
                    <td>${i + 1}</td>
                    <td>${esc(s.person_name)}</td>
                    <td>${esc(s.phone)}</td>
                    <td><audio controls preload="none" src="/audio/${encodeURIComponent(s.filename)}"></audio></td>
                    <td>${s.duration_sec ?? '—'}s</td>
                    <td>${s.sample_rate_khz ?? '—'} kHz</td>
                    <td>${s.bitrate_kbps ?? '—'} kbps</td>
                    <td>${s.loudness_db ?? '—'} LUFS</td>
                    <td><span class="${noiseBadge}">${esc(s.noise_quality || '—')}</span></td>
                    <td>${s.submitted_at ?? ''}</td>
                </tr>`;
            }).join('');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        load();
    </script>
</body>
</html>
